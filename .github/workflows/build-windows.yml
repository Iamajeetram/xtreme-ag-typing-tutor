name: Build Windows (.exe) & Mac (.dmg) Installers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Vite App & Package Windows Installer (.exe)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Typing-Tutor-Windows-Installer
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Vite App & Package MacBook Installer (.dmg)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MacBook Installer (.dmg) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Typing-Tutor-MacBook-Installer
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30
